# ennatzauge analyze
#
# Paths are relative to the EnnatzAuge root. Omit any key to use the default:
# video is the first clip in input_video/, checkpoints are the newest matching
# run under models/runs, output goes to models/analysis/latest.

video: input_video/fb_cut.mp4
frames: 0            # 0 = to the end of the clip
start: 0
imgsz: 1280
chunk: 16            # frames per inference call; bounds peak memory
scale: 10            # pixels per metre in the virtual pitch
openvino: true

# Leave these out to pick the newest players-*/best.pt and pitch-*/best.pt.
# players: models/runs/players-67dcf7c0/weights/best.pt
# pitch: models/runs/pitch-0d3e9c7c/weights/best.pt
